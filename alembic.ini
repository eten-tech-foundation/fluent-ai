# Alembic config for fluent-ai.
#
# This service owns ONLY the `ai` schema. The env.py is configured so that
# autogenerate and upgrades will never touch other schemas (`public`,
# `pgboss`, `drizzle`).
#
# The database URL is resolved at runtime from app.config (see env.py).
# Do not put credentials in this file.

[alembic]
script_location = src/app/db/migrations
prepend_sys_path = src
version_path_separator = os
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Intentionally left blank — env.py overrides this from Settings.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging config used by the alembic CLI only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
