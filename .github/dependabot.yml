version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
      labels:
          - 'github-actions'
          - 'dependencies'
          - 'automated'
      commit-message:
          prefix: 'chore(actions)'
