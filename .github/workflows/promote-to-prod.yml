name: Promote to Production
on:
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full 40-char commit SHA that was tested and approved in QA'
                required: true

concurrency: production-deploy

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read
    packages: read

jobs:
    validate:
        name: Validate & Verify Image
        runs-on: ubuntu-latest
        steps:
            - name: Validate SHA format
              run: |
                  SHA="${{ inputs.sha }}"
                  if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::'$SHA' is not a full 40-character commit SHA"
                    exit 1
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Confirm the QA-tested image exists
              run: |
                  docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.sha }} > /dev/null \
                    || { echo "::error::No image found for sha-${{ inputs.sha }}"; exit 1; }

    deploy-prod:
        name: Migrate & Deploy (prod)
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: Production
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.sha }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  python-version: '3.14'

            - name: Install dependencies (no dev)
              run: uv sync --frozen --no-dev

            - name: Run Alembic migrations
              env:
                  MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: uv run alembic upgrade head

            - name: Azure login
              uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Configure GHCR pull credentials on Web App
              run: |
                  az webapp config container set \
                    --name fluent-ai-prod \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --docker-registry-server-url https://${{ env.REGISTRY }} \
                    --docker-registry-server-user "${{ secrets.GHCR_USERNAME }}" \
                    --docker-registry-server-password "${{ secrets.GHCR_PAT }}"

            - name: Set App Service settings
              run: |
                  az webapp config appsettings set \
                    --name fluent-ai-prod \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --settings \
                      DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                      SECRET_KEY="${{ secrets.SECRET_KEY }}" \
                      OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
                      ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                      GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
                      API_SERVICE_KEY="${{ secrets.API_SERVICE_KEY }}" \
                      API_BASE_URL="${{ secrets.API_BASE_URL }}" \
                      WEBSITES_PORT="${{ vars.WEBSITES_PORT || '8200' }}" \
                      ADMIN_API_KEY_HASH="${{ secrets.ADMIN_API_KEY_HASH }}" \
                      ENVIRONMENT="production"

            - name: Deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
              with:
                  app-name: fluent-ai-prod
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD }}
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.sha }}

            - name: Verify /health
              env:
                  HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'https://fluent-ai-prod.azurewebsites.net/health' }}
              run: |
                  for i in $(seq 1 10); do
                    if curl -sf "$HEALTH_URL"; then
                      echo "Health check passed"
                      exit 0
                    fi
                    echo "Attempt $i failed, retrying in 15s..."
                    sleep 15
                  done
                  echo "Health check failed after 10 attempts"
                  exit 1
