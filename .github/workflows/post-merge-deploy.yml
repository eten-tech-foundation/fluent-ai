# Builds every commit on main once, and deploys it to the dev Web App.
#
# The image this pushes as `sha-<commit>` is the artifact QA and production
# later deploy — they never rebuild. See `.github/workflows/deploy.yml`.
name: Build, Migrate & Deploy (Dev)

on:
    push:
        branches: [main]
    workflow_dispatch: {}

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read

jobs:
    build:
        name: Build & Push Image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # A manual dispatch can be aimed at any ref. Build only main: an image
        # tagged `sha-<commit>` is the token QA and prod promotion accept, so
        # publishing one for an unmerged branch would put unreviewed code a
        # workflow dispatch away from an environment.
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
        concurrency:
            group: build-main
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-dev:
        needs: build
        uses: ./.github/workflows/deploy.yml
        with:
            sha: ${{ github.sha }}
            environment: development
            app_name: fluent-ai-dev
            app_environment: development
        secrets: inherit
