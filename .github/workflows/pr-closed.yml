name: Cleanup Merged Branch

on:
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: write

jobs:
    delete-branch:
        name: Delete merged branch
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event.pull_request.merged == true
        steps:
            - name: Delete branch
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const pr = context.payload.pull_request;
                      const branch = pr.head.ref;

                      // head.repo is null once a fork has been deleted, and a fork's head
                      // ref names a branch in the fork rather than here — deleting
                      // `heads/<branch>` would target a same-named branch in this repo.
                      if (!pr.head.repo || pr.head.repo.full_name !== context.payload.repository.full_name) {
                        core.info(`Skipping branch from a fork or deleted repository: ${branch}`);
                        return;
                      }

                      const protectedBranches = ["main", "master", "develop"];
                      if (protectedBranches.includes(branch)) {
                        core.info(`Refusing to delete protected branch: ${branch}`);
                        return;
                      }

                      // Dependabot deletes its own branches after merge, and GitHub's
                      // "Delete branch" button races this job, so an absent ref is
                      // success. 422 is NOT absence on its own — it also covers
                      // default-branch deletion and spam rejection, which must stay
                      // failures — so only trust it when the message says so.
                      const isAbsent = (error) =>
                        error.status === 404 ||
                        (error.status === 422 &&
                          /reference does not exist/i.test(error.message ?? ''));

                      try {
                        await github.rest.git.deleteRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: `heads/${branch}`,
                        });
                        core.info(`Deleted branch: ${branch}`);
                      } catch (error) {
                        if (isAbsent(error)) {
                          core.info(`Branch already deleted: ${branch}`);
                          return;
                        }
                        throw error;
                      }
