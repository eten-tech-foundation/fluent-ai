name: Pre-Merge Validation

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: pre-merge-${{ github.head_ref }}
    cancel-in-progress: true

jobs:
    workflow-pins:
        name: Action pins
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # The checker comes from the base branch, never from the PR.
            # Otherwise a pull request could replace the script with one that
            # exits 0 and add an unpinned action in the same commit, and this
            # gate would pass.
            - name: Checkout base revision (trusted checker)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base
                  sparse-checkout: .github/scripts
                  persist-credentials: false

            - name: Checkout pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: pr
                  persist-credentials: false

            - name: Verify every action is pinned to a commit SHA
              working-directory: pr
              run: |
                  checker=../base/.github/scripts/check-action-pins.rb
                  if [[ ! -f "$checker" ]]; then
                    echo "::warning::Base revision has no checker yet; using this PR's copy. Expected only for the PR that introduces the gate."
                    checker=.github/scripts/check-action-pins.rb
                  fi
                  ruby "$checker"

    validate:
        name: Lint, Typecheck, Test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: ${{ !github.event.pull_request.draft }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  python-version: '3.14'
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --frozen

            - name: Lint (ruff check)
              run: uv run ruff check .

            - name: Format check (ruff format)
              run: uv run ruff format --check .

            - name: Typecheck (mypy)
              run: uv run mypy .

            - name: Test (pytest)
              env:
                  DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/test
                  API_BASE_URL: http://localhost:8000
                  API_SERVICE_KEY: test-service-key
              run: uv run pytest
