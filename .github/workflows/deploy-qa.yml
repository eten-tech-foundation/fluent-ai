# Deploys a commit that is already on main to the QA Web App.
#
# QA is the only route to production: `promote-to-prod.yml` refuses a commit
# that has no successful QA deploy. The proof it looks for is written by the
# `mark-qa-pass` job at the bottom of this file.
name: Deploy to QA

on:
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full 40-char commit SHA to promote to QA (blank = latest main)'
                required: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read

jobs:
    resolve:
        name: Resolve & Verify Image
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: read
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
        steps:
            # `${{ }}` is substituted into the script before the shell sees it,
            # so a crafted input would execute ahead of the regex meant to
            # validate it. Everything derived from `inputs` goes through `env:`.
            - name: Resolve target SHA
              id: resolve
              env:
                  INPUT_SHA: ${{ inputs.sha }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
              run: |
                  if [ -n "$INPUT_SHA" ]; then
                    if [[ ! "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "::error::'$INPUT_SHA' is not a full 40-character commit SHA"
                      exit 1
                    fi
                    SHA="$INPUT_SHA"
                  else
                    SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')
                    echo "No SHA given; using the head of main: $SHA"
                  fi
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"

            # Images exist only for commits on main (see post-merge-deploy.yml),
            # but that is a property of another workflow's `if:`. Check it here
            # too, so QA cannot become a laundering step for unmerged code.
            - name: Confirm the commit is on main
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ steps.resolve.outputs.sha }}
              run: |
                  status=$(gh api "repos/$REPO/compare/main...$SHA" --jq '.status' 2>/dev/null || echo "unknown")
                  case "$status" in
                    identical|behind)
                      echo "$SHA is on main."
                      ;;
                    *)
                      echo "::error::$SHA is not reachable from main (compare status: $status). Merge it first."
                      exit 1
                      ;;
                  esac

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Confirm image exists in GHCR
              env:
                  SHA: ${{ steps.resolve.outputs.sha }}
              run: |
                  docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHA" > /dev/null \
                    || { echo "::error::No image found for sha-$SHA — has the build for this commit finished?"; exit 1; }

    deploy-qa:
        needs: resolve
        uses: ./.github/workflows/deploy.yml
        with:
            sha: ${{ needs.resolve.outputs.sha }}
            environment: qa
            app_name: fluent-ai-qa
            # src/app/config.py knows "development" and "production" only, and
            # QA is meant to behave like production: JSON logging, no stack
            # traces, and NO dev admin API key seeded (src/app/db/seeds/
            # api_keys.py gates that on `is_production`). QA testers therefore
            # need a real key from ADMIN_API_KEY_HASH. If you would rather QA
            # behaved like dev, this is the one word to change.
            app_environment: production
        secrets: inherit

    mark-qa-pass:
        name: Record QA deployment
        needs: [resolve, deploy-qa]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The QA pass is recorded as an image tag rather than read back off
            # the GitHub deployments API. A deployment's `sha` is the sha of the
            # workflow RUN, not of whatever the run deployed: this workflow is
            # dispatched against a branch, so deploying an older commit to QA
            # would file its deployment under the head of main and
            # `promote-to-prod` would match the wrong commit. Tagging the image
            # makes that mismatch impossible rather than merely detectable, and
            # it attaches the evidence to the artifact being promoted.
            #
            # `imagetools create` copies the manifest — it does not rebuild, so
            # qa-<sha> and sha-<sha> are by construction the same digest.
            - name: Tag the QA-verified image
              env:
                  SHA: ${{ needs.resolve.outputs.sha }}
              run: |
                  IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  docker buildx imagetools create --tag "$IMAGE:qa-$SHA" "$IMAGE:sha-$SHA"
                  echo "### Deployed to QA: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Test it, then ship it with the **Promote to Production** workflow." >> "$GITHUB_STEP_SUMMARY"
