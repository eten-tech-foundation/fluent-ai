name: Deploy to QA
on:
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full 40-char commit SHA to promote to QA (blank = latest main)'
                required: false

concurrency:
    group: deploy-qa
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read
    packages: read

jobs:
    resolve-sha:
        name: Resolve & Verify Image
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}
        steps:
            - name: Validate SHA format (if provided)
              if: inputs.sha != ''
              run: |
                  SHA="${{ inputs.sha }}"
                  if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::'$SHA' is not a full 40-character commit SHA"
                    exit 1
                  fi

            - name: Resolve target SHA
              id: resolve
              run: |
                  if [ -n "${{ inputs.sha }}" ]; then
                    echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
                  else
                    SHA=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
                    echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Confirm image exists in GHCR
              env:
                  SHA: ${{ steps.resolve.outputs.sha }}
              run: |
                  docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHA > /dev/null \
                    || { echo "::error::No image found for sha-$SHA — has this commit been pushed to main yet?"; exit 1; }

    migrate-qa:
        name: Run Migrations (QA)
        runs-on: ubuntu-latest
        needs: resolve-sha
        environment: QA
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.resolve-sha.outputs.sha }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  python-version: '3.14'

            - name: Install dependencies (no dev)
              run: uv sync --frozen --no-dev

            - name: Run Alembic migrations
              env:
                  MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: uv run alembic upgrade head

    deploy-qa:
        name: Deploy (QA)
        runs-on: ubuntu-latest
        needs: [resolve-sha, migrate-qa]
        environment:
            name: QA
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
            - name: Azure login
              uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Configure GHCR pull credentials on Web App
              run: |
                  az webapp config container set \
                    --name fluent-ai-qa \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --docker-registry-server-url https://${{ env.REGISTRY }} \
                    --docker-registry-server-user "${{ secrets.GHCR_USERNAME }}" \
                    --docker-registry-server-password "${{ secrets.GHCR_PAT }}"

            - name: Set App Service settings
              run: |
                  az webapp config appsettings set \
                    --name fluent-ai-qa \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --settings \
                      DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                      SECRET_KEY="${{ secrets.SECRET_KEY }}" \
                      OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
                      ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                      GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
                      API_SERVICE_KEY="${{ secrets.API_SERVICE_KEY }}" \
                      API_BASE_URL="${{ secrets.API_BASE_URL }}" \
                      WEBSITES_PORT="${{ vars.WEBSITES_PORT || '8200' }}" \
                      ADMIN_API_KEY_HASH="${{ secrets.ADMIN_API_KEY_HASH }}" \
                      ENVIRONMENT="production"

            - name: Deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
              with:
                  app-name: fluent-ai-qa
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_QA }}
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.resolve-sha.outputs.sha }}

            - name: Verify /health
              env:
                  HEALTH_URL: ${{ vars.QA_HEALTH_URL || 'https://fluent-ai-qa.azurewebsites.net/health' }}
              run: |
                  for i in $(seq 1 10); do
                    if curl -sf "$HEALTH_URL"; then
                      echo "Health check passed"
                      exit 0
                    fi
                    echo "Attempt $i failed, retrying in 15s..."
                    sleep 15
                  done
                  echo "Health check failed after 10 attempts"
                  exit 1

            - name: Record deployed SHA
              run: |
                  echo "### Deployed to QA: \`${{ needs.resolve-sha.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
