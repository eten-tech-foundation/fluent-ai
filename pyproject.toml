[project]
name = "fluent-ai"
version = "26.7.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic-settings>=2.14.2",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # AI
    "google-genai>=2.0.0",
    "greekroom>=0.0.20",
    "boto3>=1.43.68",
    # TTS compression tail (proposal S10.2). Ships a static ffmpeg binary as an
    # ordinary wheel, so encoding makes no assumption about what the container
    # provisions and needs no image change. See services/tts/compression.py for
    # how it is resolved and what to do if this dependency is ever dropped.
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
    "boto3-stubs[s3]>=1.43.68",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
markers = [
    # Opt-in only: `tests/tts/conftest.py` skips these unless TTS_SMOKE_REAL=1,
    # because they bill a real provider and write to a real bucket.
    "real_infra: talks to real Gemini and real R2 (costs money)",
]
pythonpath = ["src"]
cache_dir = "/tmp/.pytest_cache"

[tool.ruff]
cache-dir = "/tmp/.ruff_cache"
target-version = "py314"

[tool.mypy]
cache_dir = "/tmp/.mypy_cache"
python_version = "3.14"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# imageio_ffmpeg ships no py.typed marker; it is used for exactly one
# call (`get_ffmpeg_exe()`), whose result is checked at the use site.
module = ["asyncpg", "greekroom", "greekroom.*", "imageio_ffmpeg"]
ignore_missing_imports = true
