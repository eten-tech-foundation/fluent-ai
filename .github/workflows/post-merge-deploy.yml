name: Build, Migrate & Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to deploy to
                required: true
                default: dev
                type: choice
                options:
                    - dev
                    - prod

concurrency:
    group: deploy-${{ github.event.inputs.environment || 'dev' }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read

jobs:
    build:
        name: Build & Push Image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        outputs:
            image-tag: sha-${{ github.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Log in to GHCR
              uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Determine mutable tag
              id: tag
              run: |
                  if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
                    echo "mutable=prod" >> "$GITHUB_OUTPUT"
                  else
                    echo "mutable=dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and push
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.mutable }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy-dev:
        name: Migrate & Deploy (dev)
        needs: build
        if: github.event_name == 'push' || github.event.inputs.environment == 'dev'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: Development
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  python-version: '3.14'

            - name: Install dependencies (no dev)
              run: uv sync --frozen --no-dev

            - name: Run Alembic migrations
              env:
                  MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: uv run alembic upgrade head
              # If this step fails, the job stops here — appsettings/deploy below never run.

            - name: Azure login
              uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Configure GHCR pull credentials on Web App
              # GHCR packages pushed via GITHUB_TOKEN are private by default — App
              # Service needs its own credentials to pull, unless you've manually
              # made the package public in GitHub package settings.
              run: |
                  az webapp config container set \
                    --name fluent-ai-dev \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --docker-registry-server-url https://${{ env.REGISTRY }} \
                    --docker-registry-server-user "${{ secrets.GHCR_USERNAME }}" \
                    --docker-registry-server-password "${{ secrets.GHCR_PAT }}"

            - name: Set App Service settings
              run: |
                  az webapp config appsettings set \
                    --name fluent-ai-dev \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --settings \
                      DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                      SECRET_KEY="${{ secrets.SECRET_KEY }}" \
                      OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
                      ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                      GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
                      API_SERVICE_KEY="${{ secrets.API_SERVICE_KEY }}" \
                      API_BASE_URL="${{ secrets.API_BASE_URL }}" \
                      WEBSITES_PORT="${{ vars.WEBSITES_PORT || '8200' }}"

            - name: Deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
              with:
                  app-name: fluent-ai-dev
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DEV }}
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

            - name: Verify /health
              env:
                  HEALTH_URL: ${{ vars.DEV_HEALTH_URL || 'https://fluent-ai-dev.azurewebsites.net/health' }}
              run: |
                  for i in $(seq 1 10); do
                    if curl -sf "$HEALTH_URL"; then
                      echo "Health check passed"
                      exit 0
                    fi
                    echo "Attempt $i failed, retrying in 15s..."
                    sleep 15
                  done
                  echo "Health check failed after 10 attempts"
                  exit 1

    deploy-prod:
        name: Migrate & Deploy (prod)
        needs: build
        if: github.event.inputs.environment == 'prod'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: Production
            url: ${{ steps.deploy.outputs.webapp-url }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  python-version: '3.14'

            - name: Install dependencies (no dev)
              run: uv sync --frozen --no-dev

            - name: Run Alembic migrations
              env:
                  MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: uv run alembic upgrade head
              # If this step fails, the job stops here — appsettings/deploy below never run.

            - name: Azure login
              uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Configure GHCR pull credentials on Web App
              run: |
                  az webapp config container set \
                    --name fluent-ai-prod \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --docker-registry-server-url https://${{ env.REGISTRY }} \
                    --docker-registry-server-user "${{ secrets.GHCR_USERNAME }}" \
                    --docker-registry-server-password "${{ secrets.GHCR_PAT }}"

            - name: Set App Service settings
              run: |
                  az webapp config appsettings set \
                    --name fluent-ai-prod \
                    --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
                    --settings \
                      DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                      SECRET_KEY="${{ secrets.SECRET_KEY }}" \
                      OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
                      ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                      GOOGLE_AI_API_KEY="${{ secrets.GOOGLE_AI_API_KEY }}" \
                      API_SERVICE_KEY="${{ secrets.API_SERVICE_KEY }}" \
                      API_BASE_URL="${{ secrets.API_BASE_URL }}" \
                      WEBSITES_PORT="${{ vars.WEBSITES_PORT || '8200' }}" \
                      ADMIN_API_KEY_HASH="${{ secrets.ADMIN_API_KEY_HASH }}"

            - name: Deploy to Azure Web App
              id: deploy
              uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
              with:
                  app-name: fluent-ai-prod
                  publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_PROD }}
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

            - name: Verify /health
              env:
                  HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'https://fluent-ai-prod.azurewebsites.net/health' }}
              run: |
                  for i in $(seq 1 10); do
                    if curl -sf "$HEALTH_URL"; then
                      echo "Health check passed"
                      exit 0
                    fi
                    echo "Attempt $i failed, retrying in 15s..."
                    sleep 15
                  done
                  echo "Health check failed after 10 attempts"
                  exit 1
