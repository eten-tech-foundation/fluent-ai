# Deploys a QA-tested commit to production.
#
# This is the only route to production. It refuses a commit that has no
# successful QA deploy, so QA cannot be skipped by reaching for this workflow
# instead — see the `qa-<sha>` tag written by `deploy-qa.yml`. The pause before
# the deploy is the `production` Environment's required reviewers; without that
# rule configured this workflow runs green and gates nothing.
name: Promote to Production

on:
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full 40-char commit SHA that was tested and approved in QA'
                required: true
                type: string
            skip_qa_check:
                description: 'Emergency only: promote a commit with no successful QA deploy'
                required: false
                type: boolean
                default: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read

jobs:
    validate:
        name: Validate & Verify QA
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: read
        steps:
            # `${{ }}` is substituted into the script before the shell sees it,
            # so a crafted input would execute ahead of this regex. Pass through
            # `env:` so the check actually runs before the value is used.
            - name: Validate SHA format
              env:
                  SHA: ${{ inputs.sha }}
              run: |
                  if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::'$SHA' is not a full 40-character commit SHA"
                    exit 1
                  fi

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # `qa-<sha>` is written by deploy-qa.yml only after that commit
            # deployed to QA and passed its health check. Requiring it here is
            # what makes "prod ships what QA tested" a property of the pipeline
            # rather than a convention.
            - name: Confirm the commit was deployed to QA
              if: ${{ !inputs.skip_qa_check }}
              env:
                  SHA: ${{ inputs.sha }}
              run: |
                  IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
                  qa=$(docker manifest inspect "$IMAGE:qa-$SHA" 2>/dev/null) || {
                    echo "::error::$SHA has no successful QA deployment. Run 'Deploy to QA' for it first, or use skip_qa_check if this is an emergency."
                    exit 1
                  }
                  # Belt and braces: the two tags must be the same bits. They are
                  # by construction (imagetools copies the manifest), so a
                  # mismatch means someone pushed qa-<sha> by hand.
                  built=$(docker manifest inspect "$IMAGE:sha-$SHA" 2>/dev/null) || {
                    echo "::error::No build image found for sha-$SHA."
                    exit 1
                  }
                  if [ "$qa" != "$built" ]; then
                    echo "::error::qa-$SHA and sha-$SHA are different images. Refusing to promote."
                    exit 1
                  fi
                  echo "$SHA has a verified QA deployment."

            - name: Confirm the image exists
              if: ${{ inputs.skip_qa_check }}
              env:
                  SHA: ${{ inputs.sha }}
              run: |
                  docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$SHA" > /dev/null \
                    || { echo "::error::No image found for sha-$SHA"; exit 1; }

            - name: Warn on skipped QA check
              if: ${{ inputs.skip_qa_check }}
              env:
                  SHA: ${{ inputs.sha }}
                  ACTOR: ${{ github.actor }}
              run: echo "::warning::QA verification skipped for $SHA by $ACTOR."

    deploy-prod:
        needs: validate
        uses: ./.github/workflows/deploy.yml
        with:
            sha: ${{ inputs.sha }}
            environment: production
            app_name: fluent-ai-prod
            app_environment: production
        secrets: inherit
