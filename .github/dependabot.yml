version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
      groups:
          # Batch all github-actions SHA bumps into a single weekly PR so
          # SHA-pinned workflows stay maintainable (one review/merge instead
          # of one PR per action). See docs/guides/dependabot-workflow.md
          # → "SHA pinning for GitHub Actions".
          #
          # A wildcard rather than an enumerated vendor list: this ecosystem
          # only ever contains actions, and a list silently drops any vendor
          # nobody remembered to add. The previous list would have missed
          # softprops/* and pnpm/* had those actions been adopted here.
          github-actions:
              patterns:
                  - '*'
          # Security advisories arrive as a separate update type and default to
          # their own PR per action, which is the sprawl the group above exists
          # to avoid. Same wildcard, scoped to security updates.
          github-actions-security:
              applies-to: security-updates
              patterns:
                  - '*'
      labels:
          - 'github_actions'
          - 'dependencies'
          - 'automated'
      commit-message:
          prefix: 'chore(actions)'
