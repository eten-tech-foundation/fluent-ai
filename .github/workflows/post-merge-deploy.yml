# Builds every commit on main once, and deploys it to the dev Web App.
#
# The image this pushes as `sha-<commit>` is the artifact QA and production
# later deploy — they never rebuild. Deploys address it by digest rather than
# by that tag; see `.github/workflows/deploy.yml`.
name: Build, Migrate & Deploy (Dev)

on:
    push:
        branches: [main]
    workflow_dispatch: {}

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

permissions:
    contents: read

jobs:
    build:
        name: Build & Push Image
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # A manual dispatch can be aimed at any ref. Build only main: an image
        # tagged `sha-<commit>` is the token QA and prod promotion accept, so
        # publishing one for an unmerged branch would put unreviewed code a
        # workflow dispatch away from an environment.
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            packages: write
            # Signing the provenance attestation below.
            id-token: write
            attestations: write
        concurrency:
            group: build-main
            cancel-in-progress: false
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build and push
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Signs a statement that THIS digest was built by THIS workflow from
            # THIS commit, and pushes it alongside the image. Until now the only
            # thing binding a digest to a commit was the `sha-<commit>` tag,
            # which is a mutable pointer anyone with packages:write can move —
            # so a repointed tag could put content in QA and production that
            # /health would still report as the legitimate commit. QA and
            # promotion verify this attestation before they accept a digest.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true

    deploy-dev:
        needs: build
        uses: ./.github/workflows/deploy.yml
        with:
            sha: ${{ github.sha }}
            # Straight from the build — the strongest link there is, no registry
            # round trip that a repointed tag could answer.
            image_digest: ${{ needs.build.outputs.digest }}
            environment: development
            app_name: fluent-ai-dev
            app_environment: development
        secrets: inherit
